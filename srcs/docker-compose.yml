version: '3.8'

services:

  nginx:
    build: requirements/nginx
    depends_on: ['wordpress']
    restart: always
    ports:
    - 443:443
    networks:
      devnetwork:
    volumes:
      - wp-data:/var/www/html

  mariadb:
    build: requirements/mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    secrets:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD
    networks:
      devnetwork:
    volumes:
      - db-data:/var/lib/mysql

  wordpress:
    build: requirements/wordpress
    depends_on: ['mariadb', 'redis']
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}

      DOMAIN_NAME: ${DOMAIN_NAME}
      TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}

      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD
      - WP_ADMIN_PASSWORD
      - WP_USER_PASSWORD
    networks:
      devnetwork:
    volumes:
      - wp-data:/var/www/html
  
  redis:
    build: requirements/bonus/redis
    restart: always
    networks:
      devnetwork:

  ftp:
    build: requirements/bonus/ftp
    depends_on: ['nginx']
    restart: always
    ports:
    - 21:21
    - 20:20
    - 40000-40005:40000-40005
    networks:
      devnetwork:
    environment:
      WP_ADMIN_USER: ${WP_ADMIN_USER}
    secrets:
      - WP_ADMIN_PASSWORD
    volumes:
      - wp-data:/srv/ftp

networks:
  devnetwork:

secrets:
  MYSQL_ROOT_PASSWORD:
    file: ../secrets/MYSQL_ROOT_PASSWORD.txt
  MYSQL_PASSWORD:
    file: ../secrets/MYSQL_PASSWORD.txt
  WP_ADMIN_PASSWORD:
    file: ../secrets/WP_ADMIN_PASSWORD.txt
  WP_USER_PASSWORD:
    file: ../secrets/WP_USER_PASSWORD.txt

volumes:
  db-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/gaspard/data/mysql'
  wp-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/gaspard/data/wordpress'
